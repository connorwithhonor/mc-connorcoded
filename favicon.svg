<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0d1626"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backing disc -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#ff2d2d" stroke-opacity="0.28" stroke-width="1.5"/>

  <g filter="url(#glow)" fill="none" stroke="#ff2d2d" stroke-linecap="round">
    <!-- aperture ring -->
    <circle cx="32" cy="32" r="17" stroke-width="2.4"/>
    <!-- inner fine ring -->
    <circle cx="32" cy="32" r="9.5" stroke-width="1" stroke-opacity="0.55"/>

    <!-- crosshair arms: edge -> ring, with a break before center -->
    <line x1="32" y1="4"  x2="32" y2="22" stroke-width="2.4"/>
    <line x1="32" y1="42" x2="32" y2="60" stroke-width="2.4"/>
    <line x1="4"  y1="32" x2="22" y2="32" stroke-width="2.4"/>
    <line x1="42" y1="32" x2="60" y2="32" stroke-width="2.4"/>

    <!-- short inner stadia ticks toward center -->
    <line x1="32" y1="26.5" x2="32" y2="29" stroke-width="1.6" stroke-opacity="0.8"/>
    <line x1="32" y1="35"   x2="32" y2="37.5" stroke-width="1.6" stroke-opacity="0.8"/>
    <line x1="26.5" y1="32" x2="29" y2="32" stroke-width="1.6" stroke-opacity="0.8"/>
    <line x1="35"  y1="32"  x2="37.5" y2="32" stroke-width="1.6" stroke-opacity="0.8"/>
  </g>

  <!-- center pip -->
  <circle cx="32" cy="32" r="2.1" fill="#ff2d2d" filter="url(#glow)"/>
</svg>
